# What goes in each store's submission forms, in the order each asks. This is a reference to copy
# from by hand; nothing reads it.

# App Store Connect's forms. Limits are Apple's.
app_store:
  app_information:
    # 2-30 characters. Localizable.
    name: n-grams
    # 30 characters. Localizable.
    subtitle: Daily word puzzles, no ads
    bundle_id: software.primandproper.ngrams
    # The App Store link is https://apps.apple.com/app/id6826954747.
    apple_id: "6826954747"
    primary_language: English (U.S.)
    category:
      primary: Games
      subcategories: [Word, Puzzle]
    # The word lists in NOTICE are third-party content, used under their licenses.
    content_rights: Yes, it contains third-party content, and I have the necessary rights
    # Answer every questionnaire item none or no: no ads, no web access, no user-generated content,
    # no messaging. Offensive words are blocked from every puzzle (data/blocklists/).
    age_rating: 4+
    privacy_policy_url: https://primandproper.software/ngrams/privacy/

  pricing_and_availability:
    price: Free
    availability: All countries and regions

  app_privacy:
    # Progress and settings stay on the device; the app makes no network requests.
    data_collection: Data Not Collected
    privacy_policy_url: https://primandproper.software/ngrams/privacy/

  product_page_information:
    # Header and search results: from make header. 21:9, 3840x1646, no alpha. Apple reviews it.
    header: ios/build/app-store/header.png

  version:
    # From make screenshots, uploaded in file-name order. Up to 10 per size.
    screenshots:
      # Required: iPhone with Dynamic Island (medium display), 1206x2622.
      medium: ios/build/screenshots/en/medium/
      # Optional: iPhone with Dynamic Island (large display), 1320x2868. Without it, App Store
      # Connect scales the medium set.
      large: ios/build/screenshots/en/large/

    # 170 characters. Editable any time, without a new version.
    promotional_text: >-
      Nine new puzzles every day, in English and Spanish: crack the password, rebuild words from
      tiles, and find the pangram. No ads, no accounts, no upsells.

    # 4000 characters, plain text.
    description: |-
      n-grams is a daily set of word puzzles with nothing else attached: no ads, no accounts, no energy meters, and nothing to buy.

      Three games, each at three sizes, so n varies:

      PASSWORD
      Guess the hidden word in six tries. Each guess shows which letters are in the right spot and which are in the word somewhere else. Play it at 4, 5, or 6 letters.

      TILES
      A board of word fragments hides long words that use every tile. Build any word you can from the tiles, find every hidden word, and reach the target score for a star. Hidden words run 3, 4, or 5 tiles long.

      PANGRAM
      Spell words from a wheel of letters, always using the one in the middle. Find the pangrams, the words that use every letter, and reach the target score for a star. Boards have 6, 7, or 8 letters.

      ENGLISH AND SPANISH
      Every game comes in English and in Mexican Spanish, with its own word lists and a keyboard with Ñ. Play one language or both.

      EVERY DAY
      New puzzles arrive at midnight wherever you are, the same for everyone. Missed a day? Go back and play it. Streaks and stats track every game, size, and language on its own, and sharing your results never spoils the answers.

      HARD MODES
      Each game has an optional hard mode, for when the regular rules start to feel easy.

      PRIVATE BY DESIGN
      Every puzzle ships inside the app, so it works offline. Your progress stays on your iPhone, and the app collects nothing about you.

    # 100 bytes, comma-separated. Don't repeat the app's name or use other apps' names. Each
    # keyword must be longer than two characters.
    keywords: word,puzzle,daily,guess,anagram,spelling,letters,tiles,pangram,vocabulary,spanish,español,offline

    # Must lead to real contact information.
    support_url: https://primandproper.software/ngrams/
    marketing_url: ""
    # "Year plus owner"; the form adds the ©.
    copyright: 2026 Jeffrey D
    # Not asked on the first version. 4000 characters.
    whats_new: ""
    version_release: Manually release this version
    # ITSAppUsesNonExemptEncryption is false in the Info.plist, so the form doesn't ask.
    export_compliance: No non-exempt encryption

  # The Spanish (Mexico) localization, added under App Information's language menu. Same limits as
  # the English fields above; everything not here is shared across languages.
  localizations:
    es-MX:
      name: n-grams
      subtitle: Retos diarios de palabras
      # From make screenshots SCREENSHOT_LANGUAGE=es.
      screenshots:
        medium: ios/build/screenshots/es/medium/
        large: ios/build/screenshots/es/large/
      promotional_text: >-
        Nueve retos nuevos cada día, en inglés y español: descifra la contraseña, arma palabras
        con fichas y encuentra el pangrama. Sin anuncios, sin cuentas, sin compras.
      description: |-
        n-grams es una serie diaria de retos de palabras sin nada más: sin anuncios, sin cuentas, sin medidores de energía y sin nada que comprar.

        Tres juegos, cada uno en tres tamaños, para que n varíe:

        CONTRASEÑA
        Adivina la palabra oculta en seis intentos. Cada intento muestra qué letras están en su lugar y cuáles están en la palabra en otra posición. Juega con 4, 5 o 6 letras.

        FICHAS
        Un tablero de fragmentos de palabras esconde palabras largas que usan todas las fichas. Arma cualquier palabra que puedas con las fichas, encuentra todas las palabras ocultas y alcanza el puntaje objetivo para ganar una estrella. Las palabras ocultas tienen 3, 4 o 5 fichas.

        PANGRAMA
        Forma palabras con una rueda de letras, usando siempre la del centro. Encuentra los pangramas, las palabras que usan todas las letras, y alcanza el puntaje objetivo para ganar una estrella. Los tableros tienen 6, 7 u 8 letras.

        INGLÉS Y ESPAÑOL
        Cada juego viene en inglés y en español de México, con sus propias listas de palabras y un teclado con Ñ. Juega en un idioma o en los dos.

        TODOS LOS DÍAS
        Los retos nuevos llegan a medianoche dondequiera que estés, iguales para todos. ¿Te perdiste un día? Regresa y juégalo. Las rachas y las estadísticas llevan la cuenta de cada juego, tamaño e idioma por separado, y compartir tus resultados nunca revela las respuestas.

        MODOS DIFÍCILES
        Cada juego tiene un modo difícil opcional, para cuando las reglas normales empiecen a sentirse fáciles.

        PRIVADA POR DISEÑO
        Todos los retos vienen dentro de la app, así que funciona sin conexión. Tu progreso se queda en tu iPhone y la app no recopila nada sobre ti.
      # 100 bytes; ñ and accented letters take two.
      keywords: palabras,diario,adivinar,anagrama,letras,fichas,pangrama,vocabulario,ortografía,inglés,español
      whats_new: ""

  app_review:
    # Name, email, and phone (international format, leading +) go in the form, not this public
    # file. They carry over to later versions.
    contact: Entered in App Store Connect
    sign_in_required: false
    # 4000 bytes.
    notes: |-
      No account or sign-in. Every puzzle is bundled with the app, so it works offline and makes no network requests. Home lists today's puzzles; the arrows and calendar at the bottom open earlier days. Settings turns each language and each game's hard mode on or off.

