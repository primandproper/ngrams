    # 512x512 32-bit PNG with alpha, from make icon.
    app_icon: android/app/src/main/ic_launcher-playstore.png
    # 1024x500 PNG, no alpha, from make header.
    feature_graphic: android/build/play/feature-graphic.png
    # 2-8 phone screenshots, from make screenshots, uploaded in file-name order. 1080x1920 (9:16):
    # neither side may be more than twice the other.
    phone_screenshots: android/build/play/screenshots/

  store_settings:
    category: Game › Word
    # Up to 5, chosen from Play's list.
    tags: [Word, Puzzle, Casual, Offline, Brain games]
    email: contact@primandproper.software
    website: https://primandproper.software/ngrams/

  app_content:
    privacy_policy_url: https://primandproper.software/ngrams/privacy/
    # No sign-in, so every feature is open to review.
    app_access: All functionality is available without any access restrictions
    ads: No, my app does not contain ads
    # The IARC questionnaire: answer no to violence, fear, sexuality, gambling, language, drugs,
    # user interaction, sharing location, and digital purchases. Offensive words are blocked from
    # every puzzle (data/blocklists/). Expect Everyone / PEGI 3.
    content_rating: Everyone
    # Ages under 13 would bring the app under Play's Families policy and its extra review.
    target_audience: 13-15, 16-17, 18 and over
    data_safety:
      # Progress and settings stay on the device; the app makes no network requests.
      collects_or_shares_data: No
    news_app: No
    government_app: No
    financial_features: None
    health_features: None
